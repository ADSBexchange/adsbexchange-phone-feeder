# Runs tools/security-scan.ps1 (gitleaks, osv-scanner, semgrep and syft, each in a container) on
# pull requests, on pushes to main, and weekly, since new advisories appear for dependencies that
# haven't changed. Fails if the scan finds anything to act on. The summary goes on the run page;
# the summary, SBOM and raw scanner output are kept as an artifact. Nothing is built, signed or
# installed, and no secrets are used.
name: Security scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security scan
    # As in ci.yml: while the repository is private, the LINUX_RUNNER variable (a JSON list of
    # runner labels) picks the runner; otherwise GitHub's ubuntu-latest. The runner needs Docker
    # and PowerShell 7. A scheduled run's event carries no repository details, so it always uses
    # ubuntu-latest.
    runs-on: ${{ github.event.repository.private && vars.LINUX_RUNNER && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      # The whole history, for gitleaks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan
        shell: pwsh
        run: ./tools/security-scan.ps1

      - name: Summary
        if: ${{ !cancelled() && hashFiles('security/scan-summary.md') != '' }}
        run: cat security/scan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: security-scan
          path: |
            security/scan-summary.md
            security/sbom.cdx.json
            build/security-scan
          if-no-files-found: ignore
          retention-days: 30
