# gitleaks settings for tools/security-scan.ps1: the default rules, minus paths that aren't ours.
[extend]
useDefault = true

[[allowlists]]
description = "Upstream sources and build output: not in git, cloned or generated by the build"
paths = [
  '''app/src/main/cpp/third_party/''',
  '''(^|/)build/''',
  '''(^|/)\.cxx/''',
  '''(^|/)\.gradle/''',
  '''(^|/)\.kotlin/''',
  # Claude Code worktrees: other checkouts of this repository, scanned in their own right.
  '''(^|/)\.claude/''',
  # Local documents (git-excluded, never committed). They can include saved copies of
  # adsbexchange.com pages, whose public browser keys (Brevo, WonderPush) gitleaks flags.
  '''(^|/)deliverables/''',
]
